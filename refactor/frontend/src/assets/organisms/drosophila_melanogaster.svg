<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Abdomen (striped body) -->
  <ellipse cx="48" cy="70" rx="12" ry="18" fill="#000"/>
  <!-- Thorax -->
  <ellipse cx="50" cy="50" rx="14" ry="12" fill="#000"/>
  <!-- Head -->
  <circle cx="50" cy="34" r="10" fill="#000"/>
  <!-- Compound eyes -->
  <circle cx="43" cy="30" r="6" fill="#000"/>
  <circle cx="57" cy="30" r="6" fill="#000"/>
  <!-- Wings (upper pair) -->
  <ellipse cx="28" cy="48" rx="20" ry="9" transform="rotate(-15 28 48)" fill="#000" opacity="0.85"/>
  <ellipse cx="72" cy="48" rx="20" ry="9" transform="rotate(15 72 48)" fill="#000" opacity="0.85"/>
  <!-- Wings (lower pair, smaller) -->
  <ellipse cx="31" cy="57" rx="13" ry="6" transform="rotate(-10 31 57)" fill="#000" opacity="0.75"/>
  <ellipse cx="69" cy="57" rx="13" ry="6" transform="rotate(10 69 57)" fill="#000" opacity="0.75"/>
  <!-- Legs -->
  <line x1="42" y1="55" x2="25" y2="68" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="58" x2="22" y2="72" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="62" x2="26" y2="78" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="55" x2="75" y2="68" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="58" x2="78" y2="72" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="62" x2="74" y2="78" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
